<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>證明排序評分</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 上：正確答案 -->
    <header class="panel keybar">
      <div class="brand">
        <div class="logo">∴</div>
        <div class="brand-text">
          <div class="brand-title">證明排序評分</div>
          <div class="brand-sub">正確答案</div>
        </div>
      </div>
      <div class="key-field" id="keyField">
        <span class="fmt-tag" id="keyFmtTag">ID→步驟</span>
        <input id="keyInput" class="mono hscroll" spellcheck="false" autocomplete="off"
               placeholder="輸入正確答案，例如 2→X→6→1→3→X→4→7→X→5">
        <span class="key-meta" id="keyMeta"></span>
      </div>
      <label class="n-field" title="ID 總數（敘述數量）。&#10;「步驟→ID」格式時，若最後幾個 ID 應為 X，無法從序列推得，請在此手動調大。">
        <span>ID 數</span>
        <input id="nInput" type="number" min="1" max="99">
      </label>
      <button class="icon-btn" id="btnKeyFmt" data-icon="swap" title="切換輸入格式（ID→步驟 ⇄ 步驟→ID）"></button>
      <button class="icon-btn" id="btnKeyClear" data-icon="eraser" title="清空正確答案"></button>
    </header>

    <main class="main">
      <!-- 左：學生清單 -->
      <section class="panel left">
        <div class="toolbar">
          <label class="search">
            <span class="ic" data-icon="search"></span>
            <input id="searchInput" placeholder="搜尋學號" spellcheck="false" autocomplete="off">
          </label>
          <button class="icon-btn" id="btnClearAll" data-icon="trash" title="清空所有學生"></button>
          <button class="icon-btn" id="btnExport" data-icon="download" title="匯出 CSV"></button>
          <button class="icon-btn" id="btnRecalc" data-icon="refresh" title="重新計算"></button>
        </div>
        <div class="list-head">
          <span>學號</span><span>學生答案</span><span></span><span class="r">分數</span><span></span>
        </div>
        <div class="list" id="list"></div>
        <div class="list-foot" id="listFoot"></div>
        <div class="composer" id="composer">
          <input id="sidInput" placeholder="學號" spellcheck="false" autocomplete="off"
                 title="輸入學號後按 Enter；不填直接按 Enter 會自動產生">
          <div class="ans-wrap">
            <input id="ansInput" class="mono hscroll" placeholder="學生答案" spellcheck="false" autocomplete="off"
                   title="輸入答案後按 Enter 新增；可一次貼上多行（學號[Tab]答案）">
            <button class="fmt-tag btn" id="ansFmt" title="此筆答案的格式（點擊切換）">步驟→ID</button>
          </div>
          <span class="enter-key" data-icon="enter" title="Enter"></span>
        </div>
      </section>

      <!-- 右：逐步檢查 -->
      <section class="panel right">
        <div class="bestbar">
          <div class="bb-label">最長正確序列</div>
          <div class="bb-chips hscroll" id="bestChips"></div>
          <div class="score-cell" id="scoreCell"></div>
        </div>
        <div class="detail-head">
          <div class="dh-info hscroll" id="detailInfo"></div>
          <div class="speed" id="speed"></div>
        </div>
        <div class="steps" id="steps"></div>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script src="scoring.js"></script>
  <script src="app.js"></script>
</body>
</html>
